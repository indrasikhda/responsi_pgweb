<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS Energi Sultra - ElectroMap</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link href='https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/leaflet.fullscreen.css' rel='stylesheet' />
    
    <style>
        /* CSS UTAMA */
        body {
            /* UPDATE DISINI: Menggunakan gambar background yang sama dengan index.html */
            background-image: url('img/line-design-electric-utilities-in-wisconsin-hero-2048x1280.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        /* GLASSMORPHISM STYLE */
        .glass-effect {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        .navbar-glass {
            @extend .glass-effect;
            margin-bottom: 30px;
            border-radius: 0 0 20px 20px;
            padding: 15px 0;
        }
        .card-glass {
            @extend .glass-effect;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        .card-header-glass {
            background: rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
        }
        .card-header-glass h6 {
            color: #fff !important;
            font-weight: 600;
        }
        #map {
            height: 600px;
            width: 100%;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .table-glass { color: #fff; border-color: rgba(255, 255, 255, 0.1); }
        .table-glass thead th { background-color: rgba(255, 255, 255, 0.1); color: #fff; border-bottom: 2px solid rgba(255, 255, 255, 0.2); }
        .table-glass tbody td { border-color: rgba(255, 255, 255, 0.1); }
        .table-hover tbody tr:hover { background-color: rgba(255, 255, 255, 0.2); color: #fff; }
        
        .info-legend {
            @extend .glass-effect;
            padding: 12px;
            border-radius: 8px;
            line-height: 24px;
            color: #fff;
        }
        .info-legend i { width: 20px; height: 20px; float: left; margin-right: 8px; border-radius: 3px; }
        
        /* Helper CSS */
        .navbar-glass, .card-glass, .info-legend {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-glass">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="fas fa-bolt me-2 text-warning"></i>
                <div>
                    <b>ElectroMap</b> <span class="fw-light">| Monitoring Energi</span>
                </div>
            </a>
            <a href="index.html" class="btn btn-sm btn-outline-light rounded-pill px-3">
                <i class="fas fa-home me-1"></i> Home
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="card card-glass">
            <div class="card-header-glass d-flex justify-content-between align-items-center">
                <h6 class="m-0"><i class="fas fa-map-marked-alt me-2"></i>Peta Sebaran Elektrifikasi</h6>
                <small class="text-light opacity-75">Teknologi: WMS Geoserver & Leaflet</small>
            </div>
            <div class="card-body">
                <div id="map"></div>
            </div>
        </div>

        <div class="card card-glass">
            <div class="card-header-glass">
                <h6 class="m-0"><i class="fas fa-database me-2"></i>Data</h6>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-dark table-hover table-glass mb-0" id="tabel-listrik">
                        <thead>
                            <tr>
                                <th>Wilayah</th>
                                <th>PLN</th>
                                <th>Non-PLN</th>
                                <th>Bukan Listrik</th>
                                <th>Rasio (%)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="5" class="text-center py-3">Sedang memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src='https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/Leaflet.fullscreen.min.js'></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // --- SETUP MAP ---
        var map = L.map('map', {
            center: [-4.0, 122.0],
            zoom: 7,
            fullscreenControl: true
        });

        // BASEMAPS
        var darkBasemap = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; CARTO' }).addTo(map);
        var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' });

        // --- 4. GEOSERVER WMS ---
        var wmsLayer = L.tileLayer.wms('http://localhost:8080/geoserver/webgis_sultra/wms', {
            layers: 'webgis_sultra:Merge_sulawesi_tenggara',
            format: 'image/png',
            transparent: true,
            version: '1.1.0',
            attribution: 'GeoServer WMS'
        });

        // FUNGSI WARNA & STYLE
        function getColor(d) {
            return d > 95 ? '#1a9850' : d > 90 ? '#91cf60' : d > 75 ? '#fee08b' : d > 50 ? '#fc8d59' : '#d73027'; 
        }
        function styleAnalisis(feature) {
            return { fillColor: feature.properties.warna_isi || '#444', weight: 1.5, opacity: 1, color: '#fff', fillOpacity: 0.8 };
        }

        // FUNGSI NORMALISASI NAMA (Pembersih)
        function normalisasiNama(teks) {
            if (!teks) return "";
            return teks.toLowerCase()
                       .replace("kabupaten", "")
                       .replace("kab.", "")
                       .replace("kota", "")
                       .trim();
        }

        // LOAD DATA
        fetch('api.php')
            .then(res => res.json())
            .then(dataListrik => {
                
                // ISI TABEL
                let tbody = document.querySelector('#tabel-listrik tbody');
                tbody.innerHTML = '';
                dataListrik.forEach(row => {
                    let badge = row.rasio_elektrifikasi > 90 ? 'success' : (row.rasio_elektrifikasi > 75 ? 'warning' : 'danger');
                    tbody.innerHTML += `<tr><td class="fw-bold">${row.nama_kabkota}</td><td>${row.pln}</td><td>${row.non_pln}</td><td>${row.bukan_listrik}</td><td><span class="badge bg-${badge} text-dark">${row.rasio_elektrifikasi}%</span></td></tr>`;
                });

                // AMBIL PETA JSON
                fetch('peta.json')
                    .then(res => res.json())
                    .then(geojsonData => {
                        
                        // Join Data dengan Normalisasi
                        geojsonData.features.forEach(feature => {
                            let namaAsliPeta = feature.properties.NAMOBJ || feature.properties.WADMKK || feature.properties.KAB_KOTA;
                            
                            if(namaAsliPeta) {
                                let namaPetaBersih = normalisasiNama(namaAsliPeta);
                                let dataCocok = dataListrik.find(d => {
                                    let namaDbBersih = normalisasiNama(d.nama_kabkota);
                                    return namaDbBersih === namaPetaBersih;
                                });

                                if(dataCocok) {
                                    feature.properties.warna_isi = getColor(dataCocok.rasio_elektrifikasi);
                                    feature.properties.popupInfo = `
                                        <div style="color:#333">
                                            <strong>${dataCocok.nama_kabkota}</strong><hr style="margin:5px 0">
                                            Rasio: <b>${dataCocok.rasio_elektrifikasi}%</b><br>
                                            <small>PLN: ${dataCocok.pln}</small>
                                        </div>`;
                                }
                            }
                        });

                        var layerAnalisis = L.geoJSON(geojsonData, {
                            style: styleAnalisis,
                            onEachFeature: function(f, l) { l.bindPopup(f.properties.popupInfo || "Data Tidak Ditemukan: " + (f.properties.NAMOBJ || "Wilayah")); }
                        }).addTo(map);

                        // KONTROL LAYER
                        var baseMaps = { "Mode Gelap": darkBasemap, "Mode Terang": osmLayer };
                        var overlayMaps = {
                            "Analisis Elektrifikasi (Interaktif)": layerAnalisis,
                            "Geoserver WMS": wmsLayer
                        };
                        L.control.layers(baseMaps, overlayMaps).addTo(map);

                        // LEGENDA
                        var legend = L.control({position: 'bottomright'});
                        legend.onAdd = function (map) {
                            var div = L.DomUtil.create('div', 'info-legend');
                            div.innerHTML = '<h6><i class="fas fa-info-circle me-1"></i> Keterangan</h6>';
                            div.innerHTML += '<div><i style="background:#1a9850"></i> > 95% (Sangat Baik)</div>';
                            div.innerHTML += '<div><i style="background:#91cf60"></i> 90% - 95% (Baik)</div>';
                            div.innerHTML += '<div><i style="background:#fee08b"></i> 75% - 90% (Cukup)</div>';
                            div.innerHTML += '<div><i style="background:#fc8d59"></i> 50% - 75% (Kurang)</div>';
                            div.innerHTML += '<div><i style="background:#d73027"></i> < 50% (Sangat Kurang)</div>';
                            return div;
                        };
                        legend.addTo(map);
                    });
            })
            .catch(err => console.error(err));
    </script>
</body>
</html>
